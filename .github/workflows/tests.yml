name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ruff (errors + pyflakes)
        run: |
          pip install ruff
          ruff check phageflow tests
      - name: Validate YAML files
        run: |
          pip install pyyaml
          python - <<'PY'
          import pathlib, yaml
          files = list(pathlib.Path(".github/workflows").glob("*.yml"))
          files += [pathlib.Path("environment.yml"), pathlib.Path("phageflow/config/default_config.yaml")]
          for f in files:
              yaml.safe_load(f.read_text())
              print(f"✓ {f}")
          PY

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Check CLI
        run: |
          phageflow --help
          phageflow --version
          for cmd in qc host-removal assembly coverage viral-id quality annotate resistance run config init status download-databases; do
            phageflow "$cmd" --help > /dev/null
          done
          echo "✓ CLI OK"

      - name: Build package
        run: |
          pip install build
          python -m build
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert "phageflow/config/default_config.yaml" in names, "bundled config missing from wheel"
          print("✓ wheel contains default_config.yaml")
          PY
